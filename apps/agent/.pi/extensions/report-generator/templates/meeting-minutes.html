<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>{{title}}</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555555;
      --accent: #1f3864;
      --line: #dddddd;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 32px 40px;
      font-size: 13px;
      line-height: 1.45;
    }
    h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
    .meta { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
    h2 { font-size: 14px; margin: 24px 0 10px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    ul, ol { margin: 0; padding-left: 20px; }
    li { margin-bottom: 6px; }
    .decision { margin-bottom: 10px; }
    .decision-owner { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    <p class="meta">Дата: {{date}}</p>
  </header>

  <section>
    <h2>Участники</h2>
    <ul>
      {{#each attendees}}
      <li>{{this}}</li>
      {{/each}}
    </ul>
  </section>

  <section>
    <h2>Повестка</h2>
    <ol>
      {{#each agenda}}
      <li>{{this}}</li>
      {{/each}}
    </ol>
  </section>

  <section>
    <h2>Решения</h2>
    {{#each decisions}}
    <div class="decision">
      <p>{{text}}</p>
      <p class="decision-owner">Ответственный: {{owner}}</p>
    </div>
    {{/each}}
  </section>
</body>
</html>
