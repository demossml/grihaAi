<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Отчёт о расходах</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555555;
      --accent: #1f3864;
      --line: #dddddd;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 32px 40px;
      font-size: 13px;
      line-height: 1.45;
    }
    h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
    .period { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
    h2 { font-size: 14px; margin: 24px 0 10px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .summary-total { font-size: 28px; font-weight: 600; margin: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Отчёт о расходах</h1>
    <p class="period">Период: {{period}}</p>
  </header>

  <section>
    <h2>Итоговая сумма</h2>
    <p class="summary-total">{{totalAmount}}</p>
  </section>

  <section>
    <h2>Категории расходов</h2>
    <table>
      <thead>
        <tr><th>Категория</th><th class="amount">Сумма</th></tr>
      </thead>
      <tbody>
        {{#each categories}}
        <tr><td>{{name}}</td><td class="amount">{{amount}}</td></tr>
        {{/each}}
      </tbody>
    </table>
  </section>

  <section>
    <h2>Список трат</h2>
    <table>
      <thead>
        <tr><th>Дата</th><th>Категория</th><th>Описание</th><th class="amount">Сумма</th></tr>
      </thead>
      <tbody>
        {{#each items}}
        <tr><td>{{date}}</td><td>{{category}}</td><td>{{description}}</td><td class="amount">{{amount}}</td></tr>
        {{/each}}
      </tbody>
    </table>
  </section>
</body>
</html>
