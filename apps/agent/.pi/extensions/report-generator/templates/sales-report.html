<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Отчёт о продажах</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555555;
      --accent: #1f3864;
      --line: #dddddd;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 32px 40px;
      font-size: 13px;
      line-height: 1.45;
    }
    h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
    .period { color: var(--muted); margin: 0 0 28px; font-size: 13px; }
    h2 { font-size: 14px; margin: 24px 0 10px; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .summary-total { font-size: 28px; font-weight: 600; margin: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    ol { margin: 0; padding-left: 20px; }
    ol li { margin-bottom: 6px; }
    .deal-title { font-weight: 600; }
    .deal-amount { color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Отчёт о продажах</h1>
    <p class="period">Период: {{period}}</p>
  </header>

  <section>
    <h2>Итоговая выручка</h2>
    <p class="summary-total">{{totalRevenue}}</p>
  </section>

  <section>
    <h2>Выручка по категориям</h2>
    <table>
      <thead>
        <tr><th>Категория</th><th class="amount">Выручка</th></tr>
      </thead>
      <tbody>
        {{#each categories}}
        <tr><td>{{name}}</td><td class="amount">{{revenue}}</td></tr>
        {{/each}}
      </tbody>
    </table>
  </section>

  <section>
    <h2>Топ сделки</h2>
    <ol>
      {{#each topDeals}}
      <li><span class="deal-title">{{title}}</span> — <span class="deal-amount">{{amount}}</span></li>
      {{/each}}
    </ol>
  </section>
</body>
</html>
